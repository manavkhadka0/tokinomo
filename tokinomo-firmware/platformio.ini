; Tokinomo device firmware — ESP32-S3 (N16R8), Arduino-ESP32 + FreeRTOS
[platformio]
default_envs = esp32-s3

[env:esp32-s3]
platform  = espressif32
board     = esp32-s3-devkitc-1     ; ESP32-S3 N16R8 (16 MB flash / 8 MB PSRAM)
framework = arduino

board_build.flash_mode = qio
board_build.partitions = default_16MB.csv   ; A/B app slots + LittleFS for audio
board_build.filesystem = littlefs
board_upload.flash_size = 16MB

monitor_speed  = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed   = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM

lib_deps =
    knolleary/PubSubClient@^2.8          ; MQTT (buffer bumped in code for signed URLs)
    bblanchon/ArduinoJson@^7.2.0         ; JSON encode/decode
    ncmreynolds/ld2410@^0.1.3            ; LD2410 mmWave presence/distance
    madhephaestus/ESP32Servo@^3.0.6      ; servo PWM
    fastled/FastLED@^3.9.0               ; WS2812B
    earlephilhower/ESP8266Audio@^1.9.9   ; I2S WAV playback from LittleFS
    tzapu/WiFiManager@^2.0.17            ; captive-portal Wi-Fi provisioning
